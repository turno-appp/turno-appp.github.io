<style>
/* Layout: one narrow column like a chore chart on the fridge — tabs on top, one big "who's next" card, then the list */
:root{
  --bg:#eef2ee; --paper:#ffffff; --ink:#17302a; --muted:#5d6f69; --line:#d3ddd7;
  --accent:#f2b705; --accent-ink:#2b2100; --green:#1f7a52; --green-soft:#dcefe4; --red:#b3402e; --red-soft:#f7e2dd;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111916; --paper:#1a2521; --ink:#e4eee9; --muted:#97aaa3; --line:#2c3b35;
  --accent:#f5c22b; --accent-ink:#231a00; --green:#5fc893; --green-soft:#1e3b2e; --red:#ef7f6b; --red-soft:#3d2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111916; --paper:#1a2521; --ink:#e4eee9; --muted:#97aaa3; --line:#2c3b35;
  --accent:#f5c22b; --accent-ink:#231a00; --green:#5fc893; --green-soft:#1e3b2e; --red:#ef7f6b; --red-soft:#3d2420; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:.92rem}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
nav button{font:600 .82rem var(--body);color:var(--muted);background:none;border:0;border-radius:9px;padding:9px 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .label{color:var(--accent-ink);opacity:.75}
.hero .who{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.03em;word-break:break-word}
.hero .who.pair{font-size:2.1rem}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;font-size:1rem;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn-dark{background:var(--accent-ink);color:var(--accent)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-small{padding:7px 11px;font-size:.85rem;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:500;cursor:pointer;opacity:.85}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .meta{color:var(--muted);font-size:.85rem}
.pos{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 .8rem var(--body);background:var(--bg);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.pos.now{background:var(--accent);color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.num.plus{color:var(--green)} .num.minus{color:var(--red)}
.pill{font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.todo{background:var(--bg);color:var(--muted)}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weekbar .mid{text-align:center;flex:1}
.arrow{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:1.1rem;cursor:pointer}
.note{color:var(--muted);font-size:.86rem;margin:0}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
form{display:flex;flex-direction:column;gap:16px}
.card form{gap:12px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.field{display:flex;gap:8px;align-items:center}
.field input{flex:1;min-width:0}
input[type=text],input[inputmode]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card input{background:var(--bg)}
.amount{display:flex;align-items:center;gap:8px}
.amount span{font-weight:600;color:var(--muted)}
.amount input{width:130px;font-variant-numeric:tabular-nums}
.x{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;font-size:1.1rem}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);color:var(--muted);font-weight:600;padding:10px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:.92rem;max-width:calc(100% - 32px)}
.status{font-size:.85rem;color:var(--muted)}
.balance{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bal{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.bal .n{font-weight:600}
.bal .v{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.bal .v.plus{color:var(--green)} .bal .v.minus{color:var(--red)} .bal .v.zero{color:var(--muted)}
.settle{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.settle .row{border-color:rgba(0,0,0,.12);padding:8px 0}
.settle .meta{color:var(--accent-ink);opacity:.75}
.bins{display:flex;gap:3px;align-items:flex-end;height:22px}
.bins i{display:block;width:6px;border-radius:2px;background:var(--line)}
.bins i.on{background:var(--green)}
</style>
</head>
<body>
<style>
.me{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.me b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.picker{display:flex;flex-direction:column;gap:14px;padding-top:8vh}
.picker .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.picker .grid button{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 10px;font:800 1.4rem var(--display);color:var(--ink);cursor:pointer}
.picker .grid button:hover{border-color:var(--ink)}
.yours{background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;align-self:flex-start}
.hero .yours{background:var(--accent-ink);color:var(--accent)}
.notif{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.notif p{margin:0;color:var(--muted);flex:1;min-width:0}
.notif.on{background:var(--green-soft);border-color:transparent}
.notif.on p{color:var(--green)}
</style>

<div class="wrap" id="app">
  <header style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div><h1 id="house-name">Turno</h1><p class="sub">Bins, cleaning and shared shopping · <b>Turno</b></p></div>
    <div class="me" id="me" hidden></div>
  </header>
  <div class="notif" id="notif" hidden></div>
  <div class="notif" id="priv" hidden></div>
  <nav role="tablist" id="tabs" style="grid-template-columns:repeat(4,minmax(0,1fr))">
    <button role="tab" data-tab="garbage">Garbage</button>
    <button role="tab" data-tab="cleaning">Cleaning</button>
    <button role="tab" data-tab="expenses">Expenses</button>
    <button role="tab" data-tab="history">History</button>
  </nav>
  <p class="status" id="status" hidden></p>
  <main id="view"><div class="empty">Loading…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const VAPID_KEY  = "BIduoagP5ygzI10b4nCrE76u-I3mZdECQwWhLgvqE9RdikExvC7vMq8DVA_HKibX42DbhJ1Dq2HvNC6CfwVjpKg";                 // Firebase → Project settings → Cloud Messaging → Web Push certificates
const NOTIFY_URL = "https://turno-notify.ch4y9hp48f.workers.dev";                // your Cloudflare Worker address, e.g. https://turno-notify.xxx.workers.dev

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDWwNvpSYH6KSOSnDmc8FIH9ZrGN1tcIX4",
  authDomain: "turno-b4815.firebaseapp.com",
  projectId: "turno-b4815",
  storageBucket: "turno-b4815.firebasestorage.app",
  messagingSenderId: "191611115730",
  appId: "1:191611115730:web:c37492bc8d42dc8fef750b"

const DAY=86400000, WEEK=7*DAY;
const EPOCH=Date.UTC(2024,0,1); // a Monday
function weekOf(ts){const d=new Date(ts);const local=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());return Math.floor((local-EPOCH)/WEEK)}
function weekRange(w){const s=new Date(EPOCH+w*WEEK),e=new Date(EPOCH+w*WEEK+6*DAY);
  const f=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short",timeZone:"UTC"});return f(s)+" – "+f(e)}
const NOW_WEEK=weekOf(Date.now());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function when(ts){const d=new Date(ts),days=Math.floor((Date.now()-ts)/DAY);
  const t=d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  if(days<1&&new Date().getDate()===d.getDate())return "Today, "+t;
  if(days<7)return d.toLocaleDateString(undefined,{weekday:"short"})+", "+t;
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})}
const eur=c=>"€"+(Math.abs(c)/100).toFixed(2).replace(".",",");
const $=id=>document.getElementById(id);

const UID=()=>{try{const u=firebase.auth().currentUser;return u?u.uid:null}catch(e){return null}};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
const cleanCode=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"-").replace(/[^A-Z0-9-]/g,"").slice(0,30);
const meKey=()=>"turno-me-"+S.code;
const keyKey=c=>"turno-key-"+c;
function genKey(){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=new Uint32Array(6);crypto.getRandomValues(r);return [...r].map(x=>A[x%A.length]).join("")}
function parseHash(){const h=decodeURIComponent(location.hash.slice(1)).toUpperCase().trim();
  const m=h.match(/^([A-Z][0-9]{3})(?:[.\-_ ]([A-Z0-9]{4,20}))?$/);return m?{code:m[1],key:m[2]||null}:null}
const denied=e=>e&&(e.code==="permission-denied"||/permission/i.test(e.message||""));
function inviteURL(){return location.origin+location.pathname+"#"+S.code+(S.key?"."+S.key:"")}

let HOUSE=null;
const S={db:null,ref:null,code:null,houseLoaded:false,me:null,log:[],exp:[],loaded:false,tab:"garbage",week:NOW_WEEK,armed:null,
  ex:{what:"",amount:"",paidBy:null,split:[]},draft:null,unsub:[]};

const members=()=>HOUSE.members, tasks=()=>HOUSE.tasks||[];
const gName=g=>g.join(" & ");
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function nextGarbage(){const m=members();const last=S.log.find(e=>e.type==="garbage");
  if(!last)return m[0];const i=m.indexOf(last.member);return i<0?m[0]:m[(i+1)%m.length]}
function groupOnDuty(w){const g=HOUSE.groups,n=g.length;return g[(((w-HOUSE.startWeek)%n)+n)%n]}

function render(){
  const me=$("me"),v=$("view"),tabs=$("tabs");
  const title=HOUSE?("House "+S.code):"Turno";
  $("house-name").textContent=title;document.title=HOUSE?title+" · Turno":"Turno";
  tabs.hidden=true;me.hidden=true;$("notif").hidden=true;$("priv").hidden=true;
  if(!S.db){v.innerHTML='<div class="empty">The app isn\'t connected to its database yet. Paste the Firebase config into index.html.</div>';return}
  if(!S.code){renderRoom(v);return}
  if(!S.houseLoaded){v.innerHTML='<div class="empty">Opening house '+esc(S.code)+'…</div>';return}
  if(S.access==="locked"){renderLocked(v);return}
  if(!HOUSE){renderCreate(v);return}
  if(!S.me){renderPicker(v);return}
  tabs.hidden=false;me.hidden=false;
  me.innerHTML=`You are <b>${esc(S.me)}</b> · <button class="linkbtn" data-act="switch">Not you?</button> · <button class="linkbtn" data-act="invite">Copy invite link</button> · <button class="linkbtn" data-act="leave">Other house</button>`;
  renderNotif();renderPriv();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  if(!S.loaded){v.innerHTML='<div class="empty">Loading…</div>';return}
  ({garbage:renderGarbage,cleaning:renderCleaning,expenses:renderExpenses,history:renderHistory})[S.tab](v);
}

function renderRoom(v){
  v.innerHTML=`<form id="room-form" class="picker">
    <h2 style="font-size:1.5rem">Enter your house</h2>
    <p class="note">Type your house code: one letter and 3 numbers, like A###. Everyone in the same house uses the same code.</p>
    <input type="text" id="room-code" placeholder="A###" maxlength="4" autocomplete="off" autocapitalize="characters" style="font-size:1.3rem">
    <button class="btn btn-ink" type="submit">Continue</button>
  </form>`;
  setTimeout(()=>{const el=$("room-code");el&&el.focus()},0);
}

const VALID_CODE=/^[A-Z][0-9]{3}$/;
function renderCreate(v){
  if(!VALID_CODE.test(S.code)){
    v.innerHTML=`<div class="picker"><h2 style="font-size:1.5rem">House ${esc(S.code)} doesn't exist</h2>
      <p class="note">House codes are one letter and 3 numbers, like <b>A###</b>. Check the code and try again.</p>
      <button class="btn btn-ink" data-act="leave">Enter a different code</button></div>`;
    return;
  }
  if(!S.draft)S.draft={members:["","","",""],grp:["A","A","B","B"],tasks:["Kitchen","Bathroom","Living room"]};
  const D=S.draft;
  v.innerHTML=`<form id="create-form">
    <div class="stack-s"><h2 style="font-size:1.5rem">Set up house ${esc(S.code)}</h2>
      <p class="note">Nobody has used this code yet. Add your housemates once. After you save, this setup is locked and can't be changed from the app.</p></div>
    <fieldset><div class="label">Housemates, in garbage order · cleaning group</div>
      ${D.members.map((x,i)=>`<div class="field"><input type="text" id="members-${i}" data-key="members" data-i="${i}" value="${esc(x)}" placeholder="Name ${i+1}" maxlength="30" autocomplete="off">
        <div class="seg" role="group" aria-label="Cleaning group">${["A","B"].map(G=>`<button type="button" data-act="grp" data-i="${i}" data-g="${G}" aria-pressed="${D.grp[i]===G}">${G}</button>`).join("")}</div>
        <button type="button" class="x" data-act="rm" data-key="members" data-i="${i}" aria-label="Remove">×</button></div>`).join("")}
      <button type="button" class="btn btn-ghost btn-small" style="align-self:flex-start" data-act="add" data-key="members">Add housemate</button></fieldset>
    <fieldset><div class="label">Cleaning jobs</div>
      ${D.tasks.map((x,i)=>`<div class="field"><input type="text" id="tasks-${i}" data-key="tasks" data-i="${i}" value="${esc(x)}" placeholder="Job ${i+1}" maxlength="40" autocomplete="off">
        <button type="button" class="x" data-act="rm" data-key="tasks" data-i="${i}" aria-label="Remove">×</button></div>`).join("")}
      <button type="button" class="btn btn-ghost btn-small" style="align-self:flex-start" data-act="add" data-key="tasks">Add job</button></fieldset>
    <p class="note">Group A and group B take turns doing all the cleaning jobs, one week each. Group A starts this week.</p>
    <button class="btn btn-ink" type="submit">Create house</button>
    <button class="btn btn-ghost" type="button" data-act="leave">Use a different code</button>
  </form>`;
}

function renderLocked(v){
  v.innerHTML=`<form id="key-form" class="picker">
    <h2 style="font-size:1.5rem">House ${esc(S.code)} is private</h2>
    <p class="note">Open the invite link a housemate sent you, or type the house key. Any housemate can find it in Turno under History.</p>
    ${S.badKey?`<p class="note" style="color:var(--red)">That key isn't right. Check it and try again.</p>`:""}
    <input type="text" id="house-key" placeholder="House key" maxlength="20" autocomplete="off" autocapitalize="characters" style="font-size:1.3rem;letter-spacing:.1em">
    <button class="btn btn-ink" type="submit">Join house</button>
    <button class="btn btn-ghost" type="button" data-act="leave">Enter a different code</button>
  </form>`;
  setTimeout(()=>{const el=$("house-key");el&&el.focus()},0);
}
function renderPriv(){
  const el=$("priv");if(!el)return;
  if(!HOUSE||S.key){el.hidden=true;return}
  el.hidden=false;el.className="notif";
  el.innerHTML=`<p>Anyone who knows the code ${esc(S.code)} can open this house. Make it private so only people with the invite link can join.</p>
    <button class="btn btn-ink btn-small" data-act="lock">🔒 Make house private</button>`;
}

function renderPicker(v){
  v.innerHTML=`<div class="picker"><h2 style="font-size:1.5rem">Who are you?</h2>
    <p class="note">Tap your name. This phone will remember it.</p>
    <div class="grid">${members().map(n=>`<button data-act="pick" data-who="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <button class="linkbtn" style="align-self:flex-start" data-act="leave">Wrong house? Enter another code</button></div>`;
}

function renderGarbage(v){
  const m=members(),next=nextGarbage(),g=S.log.filter(e=>e.type==="garbage");
  const last=g[0], others=m.filter(x=>x!==next);
  const counts=Object.fromEntries(m.map(x=>[x,0])),lastBy={};
  g.forEach(e=>{if(e.member in counts)counts[e.member]++; if(!lastBy[e.member])lastBy[e.member]=e.at});
  const ni=m.indexOf(next), order=m.map((_,k)=>m[(ni+k)%m.length]);
  const daysSince=last?Math.floor((Date.now()-last.at)/DAY):null;
  const mine=next===S.me;
  v.innerHTML=`
  <div class="stack">
    <section class="hero">
      ${mine?`<span class="yours">It's your turn</span>`:""}
      <div><div class="label">Next to take the garbage out</div><div class="who">${esc(next)}</div>
      <p style="margin:6px 0 0;font-size:.9rem">${last?`Last time: ${esc(last.member)} · ${esc(when(last.at))}${daysSince>=3?` · <b>${daysSince} days ago, it's due</b>`:""}`:"Nobody has taken it out yet."}</p></div>

function balances(){
  const m=members(),b=Object.fromEntries(m.map(x=>[x,0]));
  for(const e of S.exp){
    if(e.kind==="payment"){ if(e.from in b)b[e.from]+=e.cents; if(e.to in b)b[e.to]-=e.cents; continue }
    const sp=(e.split||m).filter(x=>x in b); if(!sp.length)continue;
    if(e.paidBy in b)b[e.paidBy]+=e.cents;
    const share=Math.floor(e.cents/sp.length); let rest=e.cents-share*sp.length;
    sp.forEach(x=>{b[x]-=share+(rest>0?1:0); rest--});
  }
  return b;
}
function settlements(b){
  const pos=[],neg=[];
  for(const [n,v] of Object.entries(b)){if(v>0)pos.push({n,v});else if(v<0)neg.push({n,v:-v})}
  pos.sort((a,c)=>c.v-a.v);neg.sort((a,c)=>c.v-a.v);
  const out=[];let i=0,j=0;
  while(i<neg.length&&j<pos.length){const x=Math.min(neg[i].v,pos[j].v);if(x>0)out.push({from:neg[i].n,to:pos[j].n,cents:x});
    neg[i].v-=x;pos[j].v-=x;if(!neg[i].v)i++;if(!pos[j].v)j++}
  return out;
}
function parseCents(s){const t=String(s).trim().replace(/\s|€/g,"").replace(",",".");if(!/^\d+(\.\d{1,2})?$/.test(t))return null;return Math.round(parseFloat(t)*100)}

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const notifReady=()=>VAPID_KEY.indexOf("PASTE")<0&&NOTIFY_URL.indexOf("PASTE")<0;
function notifState(){
  if(!notifReady())return "off-config";
  if(isIOS&&!isStandalone)return "ios-install";
  if(!("Notification" in window)||!("serviceWorker" in navigator)||!window.firebase||!firebase.messaging)return "unsupported";
  if(Notification.permission==="denied")return "denied";
  if(Notification.permission==="granted"&&lsGet("turno-notif-"+S.code)===S.me)return "on";
  return "ask";
}
function renderNotif(){
  const el=$("notif");if(!el)return;
  const st=notifState();
  if(!S.me||!HOUSE||st==="off-config"||st==="unsupported"){el.hidden=true;return}
  el.hidden=false;el.className="notif"+(st==="on"?" on":"");
  el.innerHTML={
    "ios-install":`<p>To get notifications on iPhone: tap Share <b>⬆︎</b> → <b>Add to Home Screen</b>, then open Turno from your home screen.</p>`,
    "denied":`<p>Notifications are blocked for this site. Allow them in your phone or browser settings, then reload.</p>`,
    "on":`<p>🔔 Notifications are on for ${esc(S.me)}.</p>`,
    "ask":`<p>Get a notification when it's your turn.</p><button class="btn btn-ink btn-small" data-act="notif">🔔 Turn on notifications</button>`
  }[st];
}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,40)}
async function enableNotif(btn){
  if(btn)btn.disabled=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){renderNotif();return}
    const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
    await navigator.serviceWorker.ready;
    const token=await firebase.messaging().getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(!token)throw new Error("no token");
    await S.ref.collection("tokens").doc(await sha(token)).set({member:S.me,token,uid:UID(),at:Date.now()});
    lsSet("turno-notif-"+S.code,S.me);
    S.ref.collection("seen").doc(S.me).set({member:S.me,uid:UID(),notif:true},{merge:true}).catch(()=>{});
    toast("Notifications are on");
  }catch(e){console.error(e);toast("Couldn't turn on notifications. Try again in a moment.");if(btn)btn.disabled=false}
  renderNotif();
}
function notify(to,title,body){
  if(!notifReady())return;
  const list=[...new Set(to)].filter(n=>n&&n!==S.me);
  if(!list.length)return;
  fetch(NOTIFY_URL+"/notify",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({house:S.code,to:list,title,body})}).catch(()=>{});
}

function closeHouse(){S.unsub.forEach(u=>u());S.unsub=[];HOUSE=null;S.key=null;S.access=null;S.badKey=false;S.code=null;S.ref=null;S.houseLoaded=false;S.loaded=false;S.me=null;S.log=[];S.exp=[];S.draft=null;S.tab="garbage"}

async function openHouse(code,key){
  closeHouse();
  S.code=code;lsSet("turno-house",code);
  try{history.replaceState(null,"","#"+code)}catch(_){}
  if(key)lsSet(keyKey(code),key);
  S.me=lsGet(meKey());
  S.ref=S.db.collection("houses").doc(code);
  render();
  const ref=S.ref,stale=()=>S.ref!==ref;
  const st=$("status");
  const timer=setTimeout(()=>{st.textContent="Can't reach the house data yet. Check your internet connection.";st.hidden=false},10000);
  const join=k=>ref.collection("people").doc(UID()).set(k?{at:Date.now(),key:k}:{at:Date.now()}).then(()=>true,()=>false);
  try{
    const k=key||lsGet(keyKey(code));
    let d;
    try{d=await ref.get({source:"server"})}
    catch(e){
      if(!denied(e))throw e;
      // Private house and we're not a member yet: try the key.
      if(k&&await join(k)){d=await ref.get({source:"server"})}
      else{ if(stale())return; clearTimeout(timer);st.hidden=true;
        if(k){S.badKey=!!key;lsSet(keyKey(code),null)}
        S.access="locked";S.houseLoaded=true;render();return}
    }
    if(stale())return;
    clearTimeout(timer);st.hidden=true;
    if(!d.exists){S.access="new";HOUSE=null;S.houseLoaded=true;render();return}
    // House is readable: we're a member, or it's an older house that isn't private yet.
    let kd;
    try{kd=await ref.collection("private").doc("key").get({source:"server"})}
    catch(e){if(!denied(e))throw e;await join(null);kd=await ref.collection("private").doc("key").get({source:"server"})}
    if(stale())return;
    S.key=kd.exists?kd.data().key:null;
    if(S.key)lsSet(keyKey(code),S.key);
    S.access="member";
    listen(ref);
  }catch(e){
    console.error(e);if(stale())return;clearTimeout(timer);
    st.textContent="The house data isn't available right now. Reload the page to try again.";st.hidden=false;
  }
}

function listen(ref){
  const st=$("status");
  const fail=()=>{st.textContent="The house data isn't available right now. Reload the page to try again.";st.hidden=false};
  let got=0;const ready=()=>{if(++got===2){S.loaded=true}};
  S.unsub.push(ref.onSnapshot(d=>{
    HOUSE=d.exists?Object.assign({},d.data()):null;S.houseLoaded=true;
    if(HOUSE)HOUSE.groups=(HOUSE.groups||[]).map(g=>Array.isArray(g)?g:(g.names||[])).filter(g=>g.length);
    if(HOUSE&&S.me&&!HOUSE.members.includes(S.me)){S.me=null}
    if(HOUSE&&!S.ex.split.length)S.ex.split=[...HOUSE.members];
    S.ex.paidBy=S.me;markSeen(false);refresh()},fail));
  let l1=false,l2=false;
  S.unsub.push(ref.collection("log").orderBy("at","desc").limit(400).onSnapshot(q=>{
    S.log=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(!l1){l1=true;ready()}refresh()},fail));
  S.unsub.push(ref.collection("expenses").orderBy("at","desc").limit(1000).onSnapshot(q=>{
    S.exp=q.docs.map(d=>Object.assign({id:d.id},d.data()));if(!l2){l2=true;ready()}refresh()},fail));
}

(function start(){
  if(!window.firebase||FIREBASE_CONFIG.apiKey==="PASTE_HERE"){render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  S.db=firebase.firestore();
  const go=()=>{
    const h=parseHash();
    if(h)openHouse(h.code,h.key);
    else{const c=lsGet("turno-house");if(c)openHouse(c);else render()}
  };
  // Silent sign-in: every phone gets its own anonymous Firebase account, no login screen.
  let started=false;
  firebase.auth().onAuthStateChanged(u=>{if(u&&!started){started=true;go()}});
  firebase.auth().signInAnonymously().catch(e=>{
    console.error(e);
    const st=$("status");st.textContent="Couldn't connect to Turno. Check your internet connection and reload.";st.hidden=false;render();
  });
  window.addEventListener("hashchange",()=>{const h=parseHash();if(h&&(h.code!==S.code||(h.key&&h.key!==S.key)))openHouse(h.code,h.key)});
})();
</script>
